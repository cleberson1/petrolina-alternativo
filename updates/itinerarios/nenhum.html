<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Itinerário</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --warning-bg: #fff3cd;
            --warning-border: #ffeeba;
            --warning-text: #856404;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 550px;
            width: 100%;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        .icon-container {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 2rem;
            border: 2px solid var(--warning-border);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .btn-email {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
            word-break: break-all;
        }

        .btn-email:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .email-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        /* Responsividade para telas menores */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.3rem;
            }
            p {
                font-size: 0.95rem;
            }
            .btn-email {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            ⚠️
        </div>
        
        <h1>Aviso de Itinerário</h1>
        
        <p>
            Não há registro de itinerário partindo da comunidade. Caso haja, ou queira propor uma correção, por favor envie para o desenvolvedor.
        </p>

        <!-- O link mailto abre o aplicativo de e-mail padrão do usuário -->
        <a href="mailto:carlos.web@hotmail.com?subject=Correção%20ou%20Registro%20de%20Itinerário" class="btn-email">
            ✉️ Enviar E-mail
        </a>

        <div class="email-text">
            Ou envie diretamente para: <br>
            <strong>carlos.web@hotmail.com</strong>
        </div>
    </div>

</body>
</html>
